[project]
name = "portalbrasil-intranet-docs"
description = "Solução de Intranet construída com PortalBrasil & Plone"
keywords = [
    "PortalBrasil: Intranet",
    "documentation",
    "Plone",
    "Diátaxis",
]
version="1.0.0"
readme = "README.md"
requires-python = "==3.14.*"
license = "GPL-2.0-only"
maintainers = [
    { name = "PloneGov-BR", email = "gov@plone.org.br" },
]
authors = [
    { name = "PloneGov-BR", email = "gov@plone.org.br" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "portalbrasil-intranet",
]

[dependency-groups]
dev = [
    "graphviz",
    "linkify-it-py",
    "myst-parser",
    "plone-sphinx-theme",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-examples",
    "sphinx-notfound-page",
    "sphinx-reredirects",
    "sphinx-sitemap",
    "sphinx-tippy",
    "sphinxcontrib-mermaid",
    "sphinxcontrib-video",
    "sphinxcontrib-youtube",
    "sphinxext-opengraph",
    "vale",
]

[tool.uv.sources]
portalbrasil-intranet = { path = "../backend" }

[project.urls]
Repository = "https://github.com/portal-br/intranet"
Documentation = "https://portal-br.github.io/intranet"
